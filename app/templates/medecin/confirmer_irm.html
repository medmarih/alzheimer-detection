{% extends 'base.html' %}

{% block title %}Confirmation d'IRM{% endblock %}

{% block content %}
<div class="container py-4">
    <h2 class="text-center mb-4">✅ Confirmation d’IRM</h2>

    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='uploads/' + irm_image.filename) }}" 
             alt="IRM image" 
             class="img-fluid rounded shadow" 
             style="max-height: 400px;">
    </div>

    <p class="lead text-center">
        <strong>Prédiction IA :</strong> 
        {{ irm_image.prediction }} 
        <span class="badge bg-info ms-2">Confiance : {{ irm_image.confidence | round(2) }} %</span>
    </p>

    <form method="POST" class="mt-4">
        <div class="mb-3">
            <label for="commentaire" class="form-label">💬 Commentaire du médecin (optionnel)</label>
            <textarea name="commentaire" id="commentaire" class="form-control" rows="3" placeholder="Ajouter un commentaire..."></textarea>
        </div>

        <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-success">
                ✅ Confirmer et enregistrer
            </button>
            <a href="{{ url_for('medecin.medecin_dashboard') }}" class="btn btn-secondary">
                ❌ Annuler
            </a>
        </div>
    </form>
</div>
{% endblock %}
