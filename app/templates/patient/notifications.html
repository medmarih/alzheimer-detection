<style>
  /* Fond animé subtil */
  body {
    background: linear-gradient(270deg, #6a11cb, #2575fc, #6a11cb);
    background-size: 600% 600%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
    margin: 0;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .container-notifs {
    max-width: 600px;
    margin: 3rem auto;
    background: rgba(255,255,255,0.95);
    padding: 2rem 2.5rem;
    border-radius: 0.5rem;
    box-shadow: 0 0 15px rgba(37,117,252,0.4);
  }

  h1 {
    color: #2575fc;
    text-align: center;
    margin-bottom: 1.5rem;
    font-weight: 700;
  }

  ul.list-notifs {
    list-style: none;
    padding-left: 0;
  }

  ul.list-notifs li {
    background: #f8f9fa;
    margin-bottom: 0.8rem;
    padding: 0.75rem 1rem;
    border-radius: 0.375rem;
    border-left: 5px solid #2575fc;
    font-size: 1rem;
    color: #333;
  }
</style>

<div class="container-notifs">
  <h1>Mes notifications</h1>

  <ul class="list-notifs">
    {% for notif in notifications %}
      <li>{{ notif.message }} <small class="text-muted">({{ notif.created_at.strftime('%d/%m/%Y %H:%M') }})</small></li>
    {% else %}
      <li>Aucune notification pour le moment.</li>
    {% endfor %}
  </ul>
</div>
