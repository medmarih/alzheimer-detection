{% extends 'base.html' %}
{% block content %}
<style>
  /* Fond animé subtil en arrière-plan */
  body {
    background: linear-gradient(270deg, #6a11cb, #2575fc, #6a11cb);
    background-size: 600% 600%;
    animation: gradientBG 15s ease infinite;
  }
  @keyframes gradientBG {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
  }

  .form-container {
    max-width: 480px;
    background: rgba(255,255,255,0.95);
    margin: 3rem auto;
    padding: 2rem;
    border-radius: 0.5rem;
    box-shadow: 0 0 15px rgba(37,117,252,0.4);
  }

  h2 {
    color: #2575fc;
    margin-bottom: 1.5rem;
    text-align: center;
  }

  label {
    font-weight: 600;
  }

  .form-control {
    margin-bottom: 1.25rem;
  }

  button.btn-primary {
    background-color: #2575fc;
    border: none;
    width: 100%;
    padding: 0.6rem;
    font-size: 1.1rem;
    transition: background-color 0.3s ease;
  }
  button.btn-primary:hover {
    background-color: #1a54c4;
  }

  a.btn-secondary {
    display: block;
    margin-top: 1rem;
    text-align: center;
    color: #2575fc;
    text-decoration: none;
    font-weight: 600;
  }
  a.btn-secondary:hover {
    text-decoration: underline;
  }
</style>

<div class="form-container">
  <h2>Créer un médecin</h2>
  <form method="POST" novalidate>
    <div class="mb-3">
      <label for="username" class="form-label">Nom d’utilisateur :</label>
      <input type="text" class="form-control" id="username" name="username" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email :</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Mot de passe :</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Créer</button>
  </form>

  <a href="{{ url_for('admin.admin_dashboard') }}" class="btn-secondary">⬅️ Retour au tableau de bord</a>
</div>
{% endblock %}
